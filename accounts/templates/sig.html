{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Optimal Flight Route Finder - Login / Signup</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"
  integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
 
</head>

<body>

  <div class="background"></div>

  <div class="form-container">
    <div class="form-box">
      <h2 id="form-title">Welcome</h2>

      <form id="auth-form" method="POST">
        {% csrf_token %}
        {% if messages %}
        <div class="alert alert-primary" role="alert">
          {% for message in messages %}
          {{ message }}
          {% endfor %}
        </div>
        {% endif %}
        <div class="input-group">
          <label>Email</label>
          <input type="email" name="email" required placeholder="Enter email">
        </div>
        <div class="input-group">
          <label>Username</label>
          <div class="password-wrapper">
            <input type="text" name="username" required id="username" placeholder="Enter username">

            
          </div>
        </div>

        <div class="input-group">
          <label>Password</label>
          <div class="password-wrapper">
            <input type="password" name="password" required id="password" placeholder="Enter password">

            
          </div>
        </div>

    

        <div class="input-group hidden" id="extra-field">
          <label>Confirm Password</label>
          <input type="password" name="confirm_password" required id="confirm-password" placeholder="Confirm password">
        </div>

        <!-- 🛫 Corrected button: added id="takeoff-button" -->
        <button type="submit" id="takeoff-button" class="submit-button">Take Off</button>
      </form>

      <div class="toggle-box">
        <span id="toggle-text">Have a Flight ID?</span>
        <button type="submit" id="toggle-button"><a href="{% url 'SignIn' %}">Log In</a></button>
      </div>
    </div>
  </div>

</body>

</html>
